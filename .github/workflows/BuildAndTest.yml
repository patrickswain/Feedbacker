name: Build and Test Project

on: [push, pull_request]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: 
          submodules: recursive
   
      - name: Cache build directory
        uses: actions/cache@v4
        with:
            path: build
            key: macos-latest-build-${{ hashFiles('CMakeLists.txt') }}
  
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
        
      - name: Build
        run: cmake --build build --target Feedbacker --config Relase
          
      - name: Build Tests
        run: cmake --build build --target UnitTestApp --config Release

      - name: Run Tests
        run: ./build/UnitTestApp_artefacts/Release/UnitTestApp

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Cache build directory
        uses: actions/cache@v4
        with:
            path: build
            key: windows-latest-build-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
        
      - name: Build
        run: cmake --build build --target Feedbacker --config Release
          
      - name: Build Tests
        run: cmake --build build --target UnitTestApp --config Release

      - name: Run Tests
        run: .\build\UnitTestApp_artefacts\Release\UnitTestApp.exe
        shell: pwsh